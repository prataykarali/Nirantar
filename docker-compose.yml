version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: ci/Dockerfile
    container_name: nirantar_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nirantar:nirantar_secret@postgres:5432/nirantar_db
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=ollama
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  postgres:
    image: postgres:16-alpine
    container_name: nirantar_postgres
    environment:
      - POSTGRES_USER=nirantar
      - POSTGRES_PASSWORD=nirantar_secret
      - POSTGRES_DB=nirantar_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nirantar_redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: nirantar_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.3.3
    container_name: nirantar_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  pgdata:
