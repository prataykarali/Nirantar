  <!-- Gentle restorative icon in center -->
  <circle cx="400" cy="190" r="46" fill="#FEE2E2" stroke="#FECDD3" stroke-width="2"/>
  <path d="M386 190 H414 M400 176 V204" stroke="#E11D48" stroke-width="5" stroke-linecap="round"/>
