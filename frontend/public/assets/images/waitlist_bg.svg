<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wlGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="wlRadar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="glowPoint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="trackLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Ambient Background Mesh -->
  <rect width="1000" height="600" fill="url(#wlGrad1)" />

  <!-- Flowing Dynamic Waves (Confirmation Velocity Curves) -->
  <path d="M-100,200 C200,80 400,320 700,180 C900,80 1050,220 1150,160" fill="none" stroke="url(#wlRadar)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />
  <path d="M-50,350 C250,220 450,480 750,320 C950,220 1080,380 1150,300" fill="none" stroke="url(#trackLine)" stroke-width="3" opacity="0.5" />
  <path d="M0,500 C300,380 500,580 800,440 C1000,350 1100,480 1200,400" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="12 8" opacity="0.4" />

  <!-- Radar Concentric Tracking Arcs -->
  <g transform="translate(850, 150)">
    <circle r="90" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3" />
    <circle r="140" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.25" />
    <circle r="190" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.15" />
    <circle r="12" fill="#F59E0B" opacity="0.5" />
    <circle r="4" fill="#FFFFFF" />
  </g>

  <g transform="translate(150, 450)">
    <circle r="80" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4 4" opacity="0.35" />
    <circle r="130" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.2" />
    <circle r="8" fill="#7C3AED" opacity="0.6" />
    <circle r="3" fill="#FFFFFF" />
  </g>

  <!-- Glowing Radar Hotspots (Queue Clearance Nodes) -->
  <circle cx="380" cy="240" r="45" fill="url(#glowPoint)" />
  <circle cx="380" cy="240" r="5" fill="#F59E0B" />
  
  <circle cx="620" cy="380" r="60" fill="url(#glowPoint)" />
  <circle cx="620" cy="380" r="6" fill="#8B5CF6" />

  <!-- Railway Track Geometry Perspective -->
  <g opacity="0.35" transform="translate(420, 320) rotate(-15)">
    <line x1="0" y1="0" x2="300" y2="150" stroke="#7C3AED" stroke-width="2" />
    <line x1="0" y1="30" x2="300" y2="180" stroke="#7C3AED" stroke-width="2" />
    <line x1="30" y1="15" x2="20" y2="45" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="80" y1="40" x2="70" y2="70" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="130" y1="65" x2="120" y2="95" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="180" y1="90" x2="170" y2="120" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="230" y1="115" x2="220" y2="145" stroke="#F59E0B" stroke-width="1.5" />
  </g>

  <!-- Sparkle Stars -->
  <g fill="#F59E0B" opacity="0.7">
    <polygon points="280,120 283,128 291,131 283,134 280,142 277,134 269,131 277,128" />
    <polygon points="720,480 722,485 727,487 722,489 720,494 718,489 713,487 718,485" />
    <polygon points="510,90 512,94 516,96 512,98 510,102 508,98 504,96 508,94" />
  </g>
</svg>
