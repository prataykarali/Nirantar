name: NIRANTAR CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ci:
    name: Continuous Integration & Code Quality Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Core & Quality Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings python-dotenv sqlalchemy alembic psycopg2-binary redis numpy pandas scikit-learn networkx prometheus-client httpx python-jose argon2-cffi passlib pytest pytest-asyncio

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies & Build (Vercel Simulation)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest tests/ -v

      - name: Run Anti-Hardcoding Code Quality Audit
        run: |
          make audit

      - name: Run Code Quality Review
        run: |
          make review
