[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nirantar"
version = "0.1.0"
description = "NIRANTAR (PortalPulse Civic) — Local-First AI-powered Public-Service Resilience Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "torch>=2.2.0",
    "shap>=0.45.0",
    "networkx>=3.2.0",
    "locust>=2.24.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "passlib[argon2]>=1.7.4",
    "scrapling>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.2.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]
cloud-llm = [
    "google-generativeai>=0.4.0",
    "openai>=1.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "contracts*", "m0_digital_twin*", "modules*", "security*", "services*", "simulation*", "observability*", "orchestrator*", "api*"]
exclude = ["tests*", "frontend*", "frontend.*", "docs*", "plans*", "scripts*", "web_pages*", "*node_modules*", "dist*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
